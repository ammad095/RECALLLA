# Builds the Recalla mobile app for iPhone as an UNSIGNED .ipa.
#
# Building for iOS needs a Mac, and signing needs an Apple account. This job
# does only the first part, on GitHub's macOS machines. Signing and installing
# happen afterwards on any computer with the phone plugged in, using xtool
# and a free Apple ID:
#
#   xtool auth                      # once: sign in with your Apple ID
#   xtool install Recalla.ipa       # signs it for your phone and installs
#
# A free Apple ID signs for 7 days; after that, run `xtool install` again
# with the same .ipa. No rebuild needed.
#
# Run it from GitHub: Actions → "iOS build (unsigned)" → Run workflow.
# The .ipa is attached to the run as the "Recalla-ipa" artifact.

name: iOS build (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "recalla-mobile/**"
      - ".github/workflows/ios-unsigned.yml"

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: recalla-mobile

    steps:
      - uses: actions/checkout@v4

      # React Native needs a recent Xcode; use the newest one on the runner.
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recalla-mobile/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      # The ios/ folder is generated from app.json, not kept in git.
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: "1"

      - name: Install CocoaPods dependencies
        working-directory: recalla-mobile/ios
        run: pod install

      # Release builds bundle the JavaScript into the app, so it runs without
      # a development server. Code signing is switched off on purpose.
      - name: Build the app (unsigned)
        working-directory: recalla-mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Recalla.xcworkspace \
            -scheme Recalla \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -200

      - name: Package Recalla.ipa
        working-directory: recalla-mobile/ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "No .app produced"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Recalla.ipa Payload
          ls -lh Recalla.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Recalla-ipa
          path: recalla-mobile/ios/Recalla.ipa
          retention-days: 30
          if-no-files-found: error
